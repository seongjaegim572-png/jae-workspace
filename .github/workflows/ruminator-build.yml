name: Ruminator synth build

on:
  push:
    paths:
      - "projects/ruminator-synth/**"
      - ".github/workflows/ruminator-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/ruminator-synth

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb fonts-dejavu-core
      - name: Build tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRUMINATOR_BUILD_TESTS=ON
          cmake --build build --target RuminatorTests Ruminator_VST3
      - name: Run tests (render presets + UI screenshot)
        run: |
          mkdir -p test-output
          xvfb-run -a "$(find build -type f -name RuminatorTests -perm -u+x | head -n 1)" "$PWD/test-output"
      - uses: actions/upload-artifact@v4
        with:
          name: Ruminator-test-output
          path: projects/ruminator-synth/test-output

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (Universal: Apple Silicon + Intel)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build build --config Release -j 4 --target Ruminator_VST3 Ruminator_AU Ruminator_Standalone
      - name: Sign (ad-hoc) and package
        run: |
          mkdir -p dist
          VST3=$(find build -type d -name "Ruminator.vst3" | head -n 1)
          AU=$(find build -type d -name "Ruminator.component" | head -n 1)
          APP=$(find build -type d -name "Ruminator.app" | head -n 1)
          for b in "$VST3" "$AU" "$APP"; do codesign --force --deep --sign - "$b"; done
          cp -R "$VST3" "$AU" "$APP" dist/
          cp INSTALL.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Ruminator-macOS
          path: projects/ruminator-synth/dist

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target Ruminator_VST3 Ruminator_Standalone
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Ruminator_artefacts/Release/VST3/Ruminator.vst3 dist/
          cp build/Ruminator_artefacts/Release/Standalone/Ruminator.exe dist/
          cp INSTALL.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Ruminator-Windows
          path: projects/ruminator-synth/dist
