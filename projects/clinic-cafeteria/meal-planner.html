<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병원 식단 도우미</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--ink:#1f2328;--sub:#5f6670;--line:#e3e1db;--accent:#2f6f5e;--warn:#9a5b00;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--sub:#a0a6ad;--line:#33373c;--accent:#6fc2a8;--warn:#f0b35a;--warnbg:#3a2c14}}
:root[data-theme="dark"]{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--sub:#a0a6ad;--line:#33373c;--accent:#6fc2a8;--warn:#f0b35a;--warnbg:#3a2c14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px}
.sub{color:var(--sub);font-size:13px}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.counts label{display:block;font-size:13px;color:var(--sub)}
.counts input{width:100%;font-size:18px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.num{text-align:right;white-space:nowrap}
@media print{.tabs,.counts,.noprint{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1>병원 식단 도우미 <span class="sub">v0.1 초안</span></h1>
<div class="sub">2주 식단 → 인원수별 재료 양 → 와이마트 / 쿠팡 장보기 목록</div>
<div class="note">초안이야. 양은 1인분 생재료 기준 추정치야.</div>

<h2>1. 이번 주 입원 인원</h2>
<div class="card counts">
  <div><label>입원 인원</label><input id="n-normal" type="number" min="0" value="15"></div>
  <div><label>손실 여유분 (%)</label><input id="n-buffer" type="number" min="0" value="10"></div>
</div>

<h2>2. 2주 식단</h2>
<div class="tabs" id="weekTabs"></div>
<div class="card scroll"><table id="menu"></table></div>

<h2>3. 장보기 목록 <span class="sub" id="shopTitle"></span></h2>
<div class="grid2">
  <div class="card"><b>와이마트</b> <span class="sub">신선식품 · 주 2회 (월, 목)</span><table id="shopY"></table></div>
  <div class="card"><b>쿠팡</b> <span class="sub">쌀·건어물·냉동·양념 · 2주 1회</span><table id="shopC"></table></div>
</div>
<div class="card" style="margin-top:12px"><b>양념 (주 1회 재고 확인)</b>
  <div class="sub">저염 간장, 국간장, 된장, 고추장, 고춧가루, 다진마늘, 참기름, 들기름, 식용유, 깨, 식초, 올리고당.</div>
</div>
<p class="sub noprint">인쇄하면 입력칸은 빠지고 표만 나와.</p>
</main>

<script>
// 재료: [이름, 1인분 g, 가게(Y=와이마트, C=쿠팡)]
const SOUPS=[
 {n:"소고기미역국",i:[["마른미역",3,"C"],["소고기 국거리",20,"Y"]]},
 {n:"콩나물국",i:[["콩나물",50,"Y"],["대파",5,"Y"]]},
 {n:"소고기무국",i:[["무",50,"Y"],["소고기 국거리",20,"Y"],["대파",5,"Y"]]},
 {n:"애호박된장국",i:[["애호박",40,"Y"],["두부",30,"Y"]]},
 {n:"계란국",i:[["계란",25,"Y"],["대파",5,"Y"]]},
 {n:"북엇국",i:[["북어채",8,"C"],["무",20,"Y"],["계란",15,"Y"]]},
 {n:"배추된장국",i:[["배추",50,"Y"]]},
 {n:"순두부계란국",i:[["순두부",60,"Y"],["계란",15,"Y"],["대파",5,"Y"]]}
];
const MAINS=[
 {n:"제육볶음",i:[["돼지 앞다리살",70,"Y"],["양파",20,"Y"]]},
 {n:"닭다리살 간장조림",i:[["닭다리살",80,"Y"],["당근",15,"Y"]]},
 {n:"고등어구이",i:[["고등어(손질)",70,"Y"]]},
 {n:"소불고기",i:[["소고기 불고기용",70,"Y"],["양파",20,"Y"]]},
 {n:"두부조림",i:[["두부",100,"Y"]]},
 {n:"삼치구이",i:[["삼치(손질)",70,"Y"]]},
 {n:"간장돼지불고기",i:[["돼지 앞다리살",70,"Y"],["양파",20,"Y"]]},
 {n:"닭가슴살 채소볶음",i:[["닭가슴살",80,"Y"],["양배추",30,"Y"],["당근",10,"Y"]]},
 {n:"오징어볶음",i:[["냉동 손질오징어",70,"C"],["양배추",30,"Y"],["양파",15,"Y"]]},
 {n:"가자미구이",i:[["냉동 가자미",70,"C"]]},
 {n:"돼지고기 수육",i:[["돼지 앞다리살",80,"Y"]]},
 {n:"소고기 버섯볶음",i:[["소고기 불고기용",60,"Y"],["느타리버섯",30,"Y"]]}
];
const SIDES=[
 {n:"콩나물무침",i:[["콩나물",50,"Y"]]},
 {n:"무생채",i:[["무",50,"Y"]]},
 {n:"애호박볶음",i:[["애호박",50,"Y"]]},
 {n:"숙주나물",i:[["숙주",50,"Y"]]},
 {n:"오이무침",i:[["오이",50,"Y"]]},
 {n:"가지볶음",i:[["가지",50,"Y"]]},
 {n:"구운김",i:[["조미 안 된 김",2,"C"]]},
 {n:"계란말이",i:[["계란",30,"Y"]]},
 {n:"시금치나물",i:[["시금치",50,"Y"]]},
 {n:"청경채볶음",i:[["청경채",50,"Y"]]},
 {n:"마늘쫑볶음",i:[["마늘쫑",40,"Y"]]},
 {n:"느타리버섯볶음",i:[["느타리버섯",50,"Y"]]},
 {n:"감자채볶음",i:[["감자",50,"Y"]]},
 {n:"브로콜리 데침",i:[["브로콜리",50,"Y"]]},
 {n:"멸치볶음",i:[["잔멸치",8,"C"]]},
 {n:"양배추찜",i:[["양배추",50,"Y"]]}
];
const DAYS=["월","화","수","목","금","토","일"], MEALS=["아침","점심","저녁"];

function plan(){
  const out=[];
  for(let m=0;m<42;m++){
    out.push({soup:SOUPS[(m*5)%SOUPS.length],main:MAINS[(m*5)%MAINS.length],
      s1:SIDES[(m*3)%SIDES.length],s2:SIDES[(m*3+7)%SIDES.length]});
  }
  return out;
}
const PLAN=plan();
let week=0;

function get(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)||v<0?0:v}
function counts(){return{N:get("n-normal"),B:get("n-buffer")}}

function renderMenu(){
  let h="<tr><th></th>"+MEALS.map(x=>"<th>"+x+"</th>").join("")+"</tr>";
  for(let d=0;d<7;d++){
    h+="<tr><th>"+DAYS[d]+"</th>";
    for(let t=0;t<3;t++){
      const p=PLAN[(week*7+d)*3+t];
      h+="<td>밥<br>"+p.soup.n+"<br><b>"+p.main.n+"</b><br>"+p.s1.n+"<br>"+p.s2.n+"<br>배추김치</td>";
    }
    h+="</tr>";
  }
  document.getElementById("menu").innerHTML=h;
}
function add(map,name,g,store){const k=store+"|"+name;map[k]=(map[k]||0)+g}
function renderShop(){
  const {N,B}=counts(), all=N, buf=1+B/100, map={};
  for(let x=week*21;x<week*21+21;x++){
    const p=PLAN[x];
    add(map,"백미",90*all,"C");
    p.soup.i.forEach(([n,g,s])=>add(map,n,g*all,s));
    p.main.i.forEach(([n,g,s])=>add(map,n,g*all,s));
    [p.s1,p.s2].forEach(sd=>sd.i.forEach(([n,g,s])=>add(map,n,g*all,s)));
    add(map,"배추김치",40*all,"C");
  }
  const rows={Y:[],C:[]};
  Object.entries(map).forEach(([k,g])=>{const[s,n]=k.split("|");if(g>0)rows[s].push([n,g*buf])});
  const fmt=g=>g>=1000?(g/1000).toFixed(1)+" kg":Math.round(g)+" g";
  const tbl=r=>"<tr><th>재료</th><th class='num'>1주 필요량</th></tr>"+r.sort((a,b)=>b[1]-a[1]).map(([n,g])=>{
    const egg=n==="계란"?" (약 "+Math.ceil(g/55)+"개)":"";
    return "<tr><td>"+n+"</td><td class='num'>"+fmt(g)+egg+"</td></tr>"}).join("");
  document.getElementById("shopY").innerHTML=tbl(rows.Y);
  document.getElementById("shopC").innerHTML=tbl(rows.C);
  document.getElementById("shopTitle").textContent=(week+1)+"주차 · 총 "+all+"명 · 여유분 "+B+"% 포함 · 와이마트는 반으로 나눠 월·목에 사기";
}
function renderTabs(){
  document.getElementById("weekTabs").innerHTML=[0,1].map(w=>"<button class='"+(w===week?"on":"")+"' data-w='"+w+"'>"+(w+1)+"주차</button>").join("");
  document.querySelectorAll("#weekTabs button").forEach(b=>b.onclick=()=>{week=+b.dataset.w;render()});
}
function render(){renderTabs();renderMenu();renderShop();
  try{localStorage.setItem("mealCounts",JSON.stringify(counts()))}catch(e){}}
try{const c=JSON.parse(localStorage.getItem("mealCounts")||"null");
  if(c){document.getElementById("n-normal").value=c.N;document.getElementById("n-buffer").value=c.B}}catch(e){}
document.querySelectorAll(".counts input").forEach(i=>i.oninput=render);
render();
</script>
</body>
</html>
